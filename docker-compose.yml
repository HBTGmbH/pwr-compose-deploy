services:
  pwr-ingress:
    image: jonasal/nginx-certbot:latest
    restart: "always"
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - ./conf/nginx:/etc/nginx/user_conf.d
      - ./letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
  pwr-edge-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-edge-service:main
    restart: 'always'
    volumes:
      - pwr-log-files:/var/logs
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      spring_application_name: pwr-edge-service
      spring_http_multipart_max_file_size: 16MB
      spring_http_multipart_max_request_size: 16MB
      spring_security_oauth2_resourceserver_jwt_issuer-uri: ${OAUTH2_ISSUER_URI}
      TZ: 'Europe/Berlin'
  pwr_mariaDb:
    image: mariadb:11
    restart: 'always'
    ports:
      - 9010:3306
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: 'Europe/Berlin'
    volumes:
      - db-data:/var/lib/mysql
  pwr-profile-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-profile-service:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      DB_USER: ${PROFILE_DB_USER}
      DB_PASS: ${PROFILE_DB_PASS}
      DB_URL: jdbc:mariadb://pwr_mariaDb:3306/profile
      DB_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      DB_HIBERNATE_DDL_AUTO: none
      TZ: 'Europe/Berlin'
    depends_on:
      - pwr_mariaDb
  pwr_webclient:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-webclient:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      POWER_PROFILE_SERVICE_URL: https://${POWER_HOST}/api/pwr-profile-service
      POWER_SKILL_SERVICE_URL: https://${POWER_HOST}/api/pwr-skill-service
      POWER_VIEW_PROFILE_SERVICE_URL: https://${POWER_HOST}/api/pwr-view-profile-service
      POWER_REPORT_SERVICE_URL: https://${POWER_HOST}/api/pwr-report-service
      POWER_STATISTICS_SERVICE_URL: https://${POWER_HOST}/api/pwr-statistics-service
      POWER_LOCALE_PATH: https://${POWER_HOST}/localization
      POWER_IMAGE_PATH: /img
      POWER_AZURE_TENANT_ID: ${POWER_AZURE_TENANT_ID}
      POWER_AZURE_CLIENT_ID: ${POWER_AZURE_CLIENT_ID}
  pwr-skill-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-skill-service:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      DB_USER: ${SKILL_DB_USER}
      DB_PASS: ${SKILL_DB_PASS}
      DB_URL: jdbc:mariadb://pwr_mariaDb:3306/skill
      DB_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      DB_HIBERNATE_DDL_AUTO: none
      TZ: 'Europe/Berlin'
    volumes:
      - lucene-data:/lucene-data
    depends_on:
      - pwr_mariaDb
  pwr-view-profile-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-view-profile-service:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      DB_DATABASE: 4
      DB_PORT: 6379
      DB_HOST: view_profile_service_db
      SPRING_REDIS_PASSWORD: ${VIEW_PROFILE_DB_PASS}
      TZ: 'Europe/Berlin'
    depends_on:
      - view_profile_service_db
  view_profile_service_db:
    image: redis:alpine
    restart: 'always'
    command: redis-server --requirepass ${VIEW_PROFILE_DB_PASS}
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    volumes:
      - "./conf/redis.conf:/usr/local/etc/redis/redis.conf"
      - "./rdb-data:/data"
  pwr-report-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-report-service:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      DB_USER: ${REPORT_DB_USER}
      DB_PASS: ${REPORT_DB_PASS}
      DB_URL: jdbc:mariadb://pwr_mariaDb:3306/report
      DB_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      DB_HIBERNATE_DDL_AUTO: none
      LOGGING_LEVEL_DE_HBT: 'DEBUG'
      TZ: 'Europe/Berlin'
    volumes:
      # HBT font Simplon Norm for PDFs (licensed, not in git, see fonts/README.md); empty: Noto Sans from the image
      - ./fonts:/fonts:ro
    depends_on:
      - pwr_mariaDb
  pwr-statistics-service:
    image: ghcr.io/hbtgmbh/hbt-power/pwr-statistics-service:main
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    environment:
      DB_HOST: view_profile_service_db
      DB_PORT: 6379
      DB_DATABASE: 0
      DB_PASSWORD: ${VIEW_PROFILE_DB_PASS}
  watchtower: #watchtower auto-updates our containers; It checks every 5 minutes.
    image: beatkind/watchtower
    restart: 'always'
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "20m"
    command: --interval 600 # every 10 minutes
    volumes:
      - ~/.docker/config.json:/config.json 
      - /var/run/docker.sock:/var/run/docker.sock
  db-backup:
    image: fradelg/mysql-cron-backup
    volumes:
      - ./pwr-backup:/backup
    environment:
      - MYSQL_HOST=pwr_mariaDb
      - MYSQL_USER=root
      - MYSQL_PASS=${DB_ROOT_PASSWORD}
      - MAX_BACKUPS=30
      - INIT_BACKUP=0
      # Every day at 02:00
      - CRON_TIME=0 2 * * *
      # Make it small
      - GZIP_LEVEL=9
    restart: unless-stopped
volumes:
  pwr-log-files: {}
  db-data: {}
  lucene-data: {}
