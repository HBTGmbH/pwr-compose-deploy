# Docker's DNS: container names are re-resolved while running, not only when nginx starts.
# Watchtower recreates the app containers with new IPs; with names resolved once at start the
# ingress kept the old IPs and answered every request with 502 (2026-10-20, after all seven
# images were updated at once). Needs nginx >= 1.27.3 for "resolve" without NGINX Plus.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream webclient {
    zone webclient 64k;
    server pwr_webclient:80 resolve;
}

upstream edge {
    zone edge 64k;
    server pwr-edge-service:9000 resolve;
}

server {
    listen 443 ssl;
    server_name power.hbt.de;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header HOST $http_host;

    ssl_certificate     /etc/letsencrypt/live/power.hbt.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/power.hbt.de/privkey.pem;

    gzip on;
    gzip_types application/json;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_http_version 1.1;

    location / {
        client_max_body_size 50M;
        proxy_pass http://webclient;
        add_header X-Frame-Options sameorigin;
    }

    location /api/ {
        client_max_body_size 50M;
        # The trailing slash strips /api, as before
        proxy_pass http://edge/;
    }
}

